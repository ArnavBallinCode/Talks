<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let the Agent Cook 🔥 Building AI-Native Developer Workflows</title>
<meta name="description" content="A hands-on workshop on turning Claude Code into a reliable developer workflow with repository instructions, generated skills, MCP, memory, subagents and hooks. Arnav Angarkar.">
<meta name="theme-color" content="#0e0c0b">
<!-- Generated by _build/build.py from the files in _build/. Edit those, then rebuild. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
@@css@@
</style>
</head>
<body>
<a class="skip" href="#deck">Skip to slides</a>
<div class="stage" id="stage">
  <main class="deck" id="deck" aria-roledescription="slide deck" aria-label="Let the Agent Cook">
@@slides@@
  </main>

  <nav class="bar" aria-label="Slide controls">
    <span class="bar-act" id="barAct">Opening</span>
    <span class="bar-title" id="barTitle"></span>
    <div class="bar-progress" id="barProgress" aria-hidden="true"></div>
    <span class="bar-count" id="barCount" aria-live="off">01 / 30</span>
    <button type="button" id="btnPrev" aria-label="Previous (Left arrow)" title="Previous (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" id="btnNext" aria-label="Next (Right arrow)" title="Next (→ or Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button type="button" id="btnGrid" aria-label="All slides (O)" title="All slides (O)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
    <button type="button" id="btnNotes" aria-label="Speaker notes (N)" aria-pressed="false" title="Speaker notes (N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 10h14M5 15h9"/></svg></button>
    <button type="button" id="btnPresenter" aria-label="Presenter window (P)" title="Presenter window (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v11H3zM8 20h8M12 16v4"/></svg></button>
    <button type="button" id="btnFs" aria-label="Full screen (F)" title="Full screen (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </nav>

  <aside class="notes-panel" id="notesPanel" hidden aria-label="Speaker notes">
    <h2>Speaker notes</h2>
    <div id="notesBody"></div>
  </aside>
  <div class="blackout" id="blackout" hidden></div>
</div>

<dialog class="overview" id="overview" aria-labelledby="overviewTitle">
  <header>
    <h2 id="overviewTitle">All slides</h2>
    <button type="button" class="close" id="overviewClose" aria-label="Close">Esc</button>
  </header>
  <div class="overview-grid" id="overviewGrid"></div>
  <footer>
    <kbd>→</kbd> <kbd>Space</kbd> next · <kbd>←</kbd> back · <kbd>Home</kbd>/<kbd>End</kbd> first/last ·
    type a number + <kbd>Enter</kbd> to jump · <kbd>N</kbd> notes · <kbd>P</kbd> presenter ·
    <kbd>F</kbd> full screen · <kbd>B</kbd> black screen · <kbd>O</kbd> this view
  </footer>
</dialog>

<div class="sr-only" id="announcer" aria-live="polite"></div>

<script>
@@js@@
</script>
</body>
</html>
